[workspace]
resolver = "2"
members = [
    "crates/xram-cuda",
    "crates/xram-codec",
    "crates/xram-tier",
    "crates/xram-probe",
    "crates/xram-ratio",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
repository = "https://github.com/IlumCI/XRAM"

[workspace.dependencies]
libc = "0.2"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lz4_flex = { version = "0.14", default-features = false, features = ["std", "checked-decode"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 1
